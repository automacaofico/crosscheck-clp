<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crosscheck EAP × CLP — FICO Infra</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{
  --navy:#142A4C; --navy2:#1E3A63; --laranja:#F89B32; --laranja2:#FFB259; --azul:#3578BC; --azul2:#4A90D9;
  --verde:#2E9B4E; --amarelo:#F4C430; --vermelho:#D14545;
  --cinza-bg:#EEF1F6; --cinza-borda:#E1E6EE; --cinza-txt:#5A6A7E;
  --branco:#FFFFFF; --preto:#1A1A1A;
  --sh-sm:0 2px 6px rgba(20,42,76,.08);
  --sh-navy:0 10px 30px rgba(20,42,76,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(53,120,188,.10), transparent 60%),
    radial-gradient(900px 500px at -5% 20%, rgba(248,155,50,.08), transparent 55%),
    var(--cinza-bg);
  font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:var(--preto);
  font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh;
}
.app{max-width:1300px;margin:0 auto;padding:0 26px 48px}
header.topo{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 55%,#24467a 100%);
  color:#fff;padding:26px 34px;border-radius:0 0 18px 18px;position:relative;overflow:hidden;
  box-shadow:var(--sh-navy);margin-bottom:22px;
}
header.topo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;
  background:linear-gradient(180deg,var(--laranja),var(--laranja2));box-shadow:2px 0 12px rgba(248,155,50,.5)}
header.topo::after{content:"";position:absolute;right:-80px;top:-120px;width:400px;height:400px;
  background:radial-gradient(circle,rgba(53,120,188,.35),transparent 70%);border-radius:50%}
header.topo a.voltar{color:#fff;text-decoration:none;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.14);
  padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25)}
header.topo a.voltar:hover{background:rgba(255,255,255,.22)}
header.topo h1{font-size:22px;font-weight:800;margin-top:10px;position:relative;z-index:2}
header.topo p.sub{font-size:13px;color:rgba(255,255,255,.78);margin-top:4px;position:relative;z-index:2}

.ef-ajuda{color:var(--cinza-txt);font-size:12px;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi{background:#fff;border-radius:16px;padding:18px 20px;box-shadow:var(--sh-sm);position:relative;
  overflow:hidden;border:1px solid rgba(225,230,238,.7)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
.kpi.verde::before{background:var(--verde)} .kpi.laranja::before{background:linear-gradient(180deg,var(--laranja),var(--laranja2))}
.kpi.azul::before{background:linear-gradient(180deg,var(--azul),var(--azul2))} .kpi.vermelho::before{background:var(--vermelho)}
.kpi .rot{font-size:10.5px;color:var(--cinza-txt);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.kpi .val{font-size:28px;font-weight:800;color:var(--navy);margin-top:6px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11px;color:var(--cinza-txt);margin-top:4px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}

.cc-bloco{background:#fff;border:1px solid var(--cinza-borda);border-radius:14px;padding:20px 22px;
  box-shadow:var(--sh-sm);margin-bottom:20px}
.cc-bloco h3{color:var(--navy);font-size:15px;font-weight:800;display:flex;align-items:center;gap:12px;margin-bottom:4px}
.cc-logo{height:26px;width:auto;max-width:96px;object-fit:contain;background:#fff;border-radius:5px;
  padding:2px 5px;border:1px solid var(--cinza-borda)}
table.cc-tab{width:100%;border-collapse:collapse;font-size:12px;min-width:900px;margin-top:14px}
table.cc-tab th,table.cc-tab td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--cinza-borda)}
table.cc-tab th{color:#fff;background:var(--navy);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px}
table.cc-tab td.l{text-align:left}
table.cc-tab tbody tr:hover{background:#f4f7fa}
.cc-pct{display:inline-flex;align-items:center;gap:6px;font-weight:800}
.cc-fotos{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.cc-fotos img{height:34px;width:34px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--cinza-borda);
  transition:transform .12s}
.cc-fotos img:hover{transform:scale(1.12);border-color:var(--azul)}
.cc-fotos .sem{color:var(--cinza-txt);font-size:11px;font-style:italic}

.cc-ok-msg{color:var(--cinza-txt);font-size:13px;padding:16px 4px}

.cc-lightbox{position:fixed;inset:0;background:rgba(10,16,28,.85);display:none;align-items:center;justify-content:center;
  z-index:999;padding:30px;flex-direction:column;gap:14px}
.cc-lightbox.show{display:flex}
.cc-lightbox img{max-width:90vw;max-height:76vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.cc-lightbox .cc-lb-cap{color:#fff;font-size:13px;font-weight:600;text-align:center}
.cc-lightbox .cc-lb-close{position:absolute;top:20px;right:28px;color:#fff;font-size:28px;cursor:pointer;
  background:rgba(255,255,255,.12);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cc-lightbox .cc-lb-nav{display:flex;gap:10px}
.cc-lightbox .cc-lb-nav button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);
  padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.cc-lightbox .cc-lb-nav button:hover{background:rgba(255,255,255,.24)}
@media(max-width:700px){.cc-bloco{padding:14px;overflow-x:auto}}

.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;position:relative;z-index:2}
.imprimir-btn{color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
  padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.imprimir-btn:hover{background:rgba(255,255,255,.22)}

@media print{
  @page{size:A3 landscape;margin:8mm}
  html,body{background:#fff}
  .app{max-width:100%;padding:0}
  header.topo{border-radius:0;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .imprimir-btn,header.topo a.voltar,.cc-lightbox,button[onclick*="ccToggleTodos"],
  #ccKmDeInput,#ccKmAteInput,button[onclick*="ccAplicarFiltroKm"],button[onclick*="ccLimparFiltroKm"],
  button[onclick*="ccAplicarStatusFiltro"],
  .cc-bloco label{display:none !important}
  .kpi,.cc-bloco{box-shadow:none !important;border:1px solid var(--cinza-borda);break-inside:avoid;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.cc-tab{box-shadow:none !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.cc-tab tr{break-inside:avoid}
  table.cc-tab thead{display:table-header-group}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  [style*="overflow-x:auto"],[style*="overflow-x: auto"]{overflow:visible !important}
  .cc-fotos img{height:26px;width:26px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topo">
    <div class="top-row">
      <a class="voltar" href="https://automacaofico.github.io/">← Central FICO</a>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="imprimir-btn" onclick="document.getElementById('inputEap').click()">📂 Carregar EAP</button>
        <button type="button" class="imprimir-btn" onclick="document.getElementById('inputClp').click()">📂 Carregar CLP</button>
        <button type="button" class="imprimir-btn" onclick="window.print()">🖨 Exportar / Imprimir PDF</button>
      </div>
      <input type="file" id="inputEap" accept=".xlsx" style="display:none" onchange="onEapFileChosen(this.files[0])">
      <input type="file" id="inputClp" accept=".xlsx" style="display:none" onchange="onClpFileChosen(this.files[0])">
    </div>
    <h1>Crosscheck EAP × CLP</h1>
    <p class="sub">Ferrovia de Integração Centro-Oeste · Conferência do status de cada CLP (Check List de Protocolo) contra a base de pendências, com evidência fotográfica</p>
    <p class="sub" id="ccUploadStatus" style="margin-top:8px"></p>
  </header>
  <main id="main"><p class="ef-ajuda">Carregando base de pendências…</p></main>
</div>

<div class="cc-lightbox" id="ccLightbox">
  <div class="cc-lb-close" onclick="ccFecharLightbox()">✕</div>
  <img id="ccLbImg" src="" alt="">
  <div class="cc-lb-cap" id="ccLbCap"></div>
  <div class="cc-lb-nav" id="ccLbNav"></div>
</div>

let ultimasLinhasBanco=null;
let ccVerTodos=false;
function ccToggleTodos(){ ccVerTodos=!ccVerTodos; renderCrosscheck(); }
const CC_STATUS_LABEL={
  ok:'OK',
  'clp-a-frente':'Encerrado no CLP, ainda aberta na base',
  'base-a-frente':'Já encerrada na base, ainda pendente no CLP',
  'nao-encontrado':'ID do CLP não encontrado na base'
};
function ccBuscarEap(id){
  if(!ultimasLinhasBanco)return null;
  return ultimasLinhasBanco.find(r=>String(r['Id_Pendencia']).trim()===String(id).trim())||null;
}
function ccClassificar(item){
  const eap=ccBuscarEap(item.id);
  if(!eap)return {status:'nao-encontrado',eap:null};
  const eapEncerrada=String(eap['Status_Pendencia']||'').trim().toUpperCase()==='ENCERRADO';
  const clpFechado=String(item.validacao||'').trim().toUpperCase()==='ENCERRADO';
  if(clpFechado&&!eapEncerrada)return {status:'clp-a-frente',eap,eapEncerrada};
  if(!clpFechado&&eapEncerrada)return {status:'base-a-frente',eap,eapEncerrada};
  return {status:'ok',eap,eapEncerrada};
}

// ---- Fotos carregadas via upload (client-side, JSZip) ficam em cache de blob URL ----
const UPLOADED_ZIPS={};        // clpKey -> JSZip
const UPLOADED_MEDIA_CACHE={}; // "clpKey|filename" -> Promise<url>
function isUploadedClp(clpKey){ return !!UPLOADED_ZIPS[clpKey]; }
const CC_PLACEHOLDER="data:image/svg+xml;base64,"+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34"><rect width="34" height="34" fill="#e1e6ee"/></svg>');
async function compressImageBlob(blob){
  try{
    const bmp=await createImageBitmap(blob);
    const maxDim=900;
    const scale=Math.min(1, maxDim/Math.max(bmp.width,bmp.height));
    const w=Math.max(1,Math.round(bmp.width*scale)), h=Math.max(1,Math.round(bmp.height*scale));
    const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext('2d'); ctx.drawImage(bmp,0,0,w,h);
    const outBlob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',0.68));
    return URL.createObjectURL(outBlob||blob);
  }catch(e){ return URL.createObjectURL(blob); }
}
async function resolvePhotoUrl(clpKey, filename){
  const cacheKey=clpKey+'|'+filename;
  if(UPLOADED_MEDIA_CACHE[cacheKey]) return UPLOADED_MEDIA_CACHE[cacheKey];
  const zip=UPLOADED_ZIPS[clpKey];
  if(!zip) return null;
  const promise=(async()=>{
    const f=zip.file('xl/media/'+filename);
    if(!f) return null;
    const blob=await f.async('blob');
    return await compressImageBlob(blob);
  })();
  UPLOADED_MEDIA_CACHE[cacheKey]=promise;
  return promise;
}
function hydrateLazyPhotos(){
  document.querySelectorAll('img[data-lazy-clp]').forEach(async img=>{
    const clpKey=img.getAttribute('data-lazy-clp'), file=img.getAttribute('data-lazy-file');
    const url=await resolvePhotoUrl(clpKey,file);
    if(url) img.src=url;
  });
}

// ---- Lightbox de fotos ----
let ccLbFotos=[], ccLbIdx=0;
function ccAbrirLightbox(fotos, idx){
  ccLbFotos=fotos; ccLbIdx=idx;
  ccRenderLightbox();
  document.getElementById('ccLightbox').classList.add('show');
}
function ccFecharLightbox(){ document.getElementById('ccLightbox').classList.remove('show'); }
function ccLbMover(delta){ ccLbIdx=(ccLbIdx+delta+ccLbFotos.length)%ccLbFotos.length; ccRenderLightbox(); }
async function ccRenderLightbox(){
  const f=ccLbFotos[ccLbIdx];
  const imgEl=document.getElementById('ccLbImg');
  if(f.clpKey && isUploadedClp(f.clpKey)){
    imgEl.src=CC_PLACEHOLDER;
    const url=await resolvePhotoUrl(f.clpKey,f.src);
    if(url && ccLbFotos[ccLbIdx]===f) imgEl.src=url;
  }else{
    imgEl.src='evidencias/'+f.src;
  }
  document.getElementById('ccLbCap').textContent='ID '+f.id+' · '+f.label+' ('+(ccLbIdx+1)+'/'+ccLbFotos.length+')';
  const nav=document.getElementById('ccLbNav');
  nav.innerHTML = ccLbFotos.length>1 ? '<button onclick="ccLbMover(-1)">‹ Anterior</button><button onclick="ccLbMover(1)">Próxima ›</button>' : '';
}
const CC_FOTO_LABEL={antes:'Antes',depois1:'Depois',depois2:'Depois 2',depois3:'Depois 3',depois4:'Depois 4'};
function ccFotosHTML(clpKey, id){
  const ev=(CLP_EVIDENCIAS[clpKey]||{})[id];
  if(!ev || !Object.keys(ev).length) return '<span class="sem">sem foto</span>';
  const entradas=Object.keys(ev).map(k=>({key:k,src:ev[k],label:CC_FOTO_LABEL[k]||k,id,clpKey}));
  const lazy=isUploadedClp(clpKey);
  return '<div class="cc-fotos">'+entradas.map((e,i)=>{
    const atributos = lazy
      ? (' data-lazy-clp="'+escHtml(clpKey)+'" data-lazy-file="'+escHtml(e.src)+'" src="'+CC_PLACEHOLDER+'"')
      : (' src="evidencias/'+e.src+'"');
    return '<img'+atributos+' title="'+escHtml(e.label)+'" loading="lazy" onclick=\'ccAbrirLightbox('+JSON.stringify(entradas).replace(/'/g,"&#39;")+','+i+')\'>';
  }).join('')+'</div>';
}

function ccListaClps(){
  const chavesCarregadas=new Set(UPLOADED_CLPS.map(c=>c.clp));
  return [...CLP_CROSSCHECK.filter(c=>!chavesCarregadas.has(c.clp)), ...UPLOADED_CLPS];
}

    const m=v.match(/(-?\d+)\+(\d+)/); if(m) return parseInt(m[1])*1000+parseInt(m[2]);
  }
  const n=Number(v); return Number.isFinite(n)? n : null;
}
function ccFmtKm(v){
  const n=ccKmMetros(v); if(n==null) return null;
  const km=Math.floor(n/1000), resto=Math.round(n-km*1000);
  return km+'+'+String(resto).padStart(3,'0');
}
function ccAplicarFiltroKm(){
  const de=document.getElementById('ccKmDeInput').value.trim().replace(',','.');
  const ate=document.getElementById('ccKmAteInput').value.trim().replace(',','.');

  ccKmAte = ate===''? null : parseFloat(ate);
  renderCrosscheck();
}
function ccLimparFiltroKm(){ ccKmDe=null; ccKmAte=null; renderCrosscheck(); }

// ---- Filtro por status (Encerrada / Aberta, na base EAP) ----
let ccStatusFiltro='todos'; // 'todos' | 'encerrado' | 'aberta'

  if(!ultimasLinhasBanco){
    h+='<p class="ef-ajuda">Não foi possível carregar a base de pendências agora — os dados abaixo não puderam ser conferidos.</p>';
  }
  const lista=ccListaClps();
  if(!lista.length){
    h+='<p class="ef-ajuda">Nenhum CLP carregado ainda. Use "📂 Carregar CLP" para conferir um arquivo.</p>';
    alvo.innerHTML=h;
    return;

  // ---- lista plana de todos os itens de todos os CLPs, ordenada por KM ----

      const kmOrdenacao = eapIni!=null? eapIni : (eapFim!=null? eapFim : Infinity);
      linhas.push({clp,it,c,eapIni,eapFim,kmOrdenacao});

  linhas.sort((a,b)=>a.kmOrdenacao-b.kmOrdenacao);

  // ---- resumo agregado de todos os CLPs ----
  const totGeral={ok:0,'clp-a-frente':0,'base-a-frente':0,'nao-encontrado':0};
  linhas.forEach(l=>totGeral[l.c.status]++);
  h+='<div class="cc-bloco"><h3>Resumo geral — '+lista.length+' CLP(s)</h3>'
    +'<p class="ef-ajuda" style="margin-top:-2px">'+linhas.length+' itens conferidos no total.</p>'
    +'<div class="kpis">'
    +'<div class="kpi verde"><div class="rot">OK</div><div class="val">'+totGeral.ok+'</div></div>'

  const pillBtn=(rotulo,valor,ativo)=>'<button type="button" onclick="ccAplicarStatusFiltro(\''+valor+'\')" style="border:1px solid '+(ativo?'var(--navy)':'var(--cinza-borda)')+';background:'+(ativo?'var(--navy)':'#fff')+';color:'+(ativo?'#fff':'var(--navy)')+';padding:6px 14px;border-radius:999px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit">'+rotulo+'</button>';
  h+='<div class="cc-bloco">';
  h+='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
    +'<label class="ef-ajuda" style="margin:0">Filtrar por KM:</label>'
    +'<input type="number" step="0.001" id="ccKmDeInput" placeholder="de (ex.: 80)" value="'+(ccKmDe!=null?ccKmDe:'')+'" style="width:110px;padding:6px 9px;border:1px solid var(--cinza-borda);border-radius:8px;font-family:inherit;font-size:12px">'
    +'<span class="ef-ajuda" style="margin:0">até</span>'
    +'<input type="number" step="0.001" id="ccKmAteInput" placeholder="até (ex.: 85)" value="'+(ccKmAte!=null?ccKmAte:'')+'" style="width:110px;padding:6px 9px;border:1px solid var(--cinza-borda);border-radius:8px;font-family:inherit;font-size:12px">'
    +'<button type="button" onclick="ccAplicarFiltroKm()" style="border:1px solid var(--navy);background:var(--navy);color:#fff;padding:6px 14px;border-radius:999px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit">Aplicar</button>'
    +(filtroKmAtivo?'<button type="button" onclick="ccLimparFiltroKm()" style="border:1px solid var(--cinza-borda);background:#fff;color:var(--navy);padding:6px 14px;border-radius:999px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit">Limpar filtro</button>':'')
    +'</div>';
  h+='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px">'
    +'<label class="ef-ajuda" style="margin:0">Status na base:</label>'

    +(divergentes.length?'<button type="button" onclick="ccToggleTodos()" style="border:1px solid var(--cinza-borda);background:#fff;color:var(--navy);padding:6px 14px;border-radius:999px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit">'+(ccVerTodos?'Mostrar só divergências':'Mostrar todos os itens (com fotos)')+'</button>':'')
    +'</div>';
  h+='<div style="overflow-x:auto"><table class="cc-tab"><thead><tr>'
    +'<th>CLP</th><th>ID</th><th>Certificação</th><th>Segmento</th><th>Ativo</th><th>Empresa</th><th>Origem</th><th>Tipo</th>'
    +'<th class="l">Descrição da pendência</th><th>KM inicial</th><th>KM final</th>'
    +'<th>Item (CLP)</th><th>Validação (CLP)</th><th>Status (base)</th><th>Divergência</th><th>Evidência</th>'
    +'</tr></thead><tbody>'
    +mostrar.map(l=>{
      const eap=l.c.eap;
      const eapTxt=eap?(l.c.eapEncerrada?'Encerrado':'Aberta'):'—';
      const divTxt=l.c.status==='ok' ? '<span style="color:var(--verde);font-weight:700">OK</span>' : CC_STATUS_LABEL[l.c.status];
      const descricao=(eap && eap['Descrição Pendencia']) ? eap['Descrição Pendencia'] : l.it.resumo;
      const g=campo=>eap&&eap[campo]!=null&&eap[campo]!=='' ? eap[campo] : '—';
      const kmIni = eap? (ccFmtKm(eap['KM Inicial'])||'—') : '—';
      const kmFim = eap? (ccFmtKm(eap['KM Final'])||'—') : '—';
      return '<tr><td><b>'+escHtml(l.clp.clp)+'</b></td><td><b>'+l.it.id+'</b></td>'
        +'<td>'+escHtml(g('Certificação ?'))+'</td>'
        +'<td>'+escHtml(g('Segmento'))+'</td>'
        +'<td>'+escHtml(g('Ativo'))+'</td>'
        +'<td>'+escHtml(g('Empresa'))+'</td>'
        +'<td>'+escHtml(g('Origem'))+'</td>'
        +'<td>'+escHtml(g('Tipo de Pendencia'))+'</td>'
        +'<td class="l">'+escHtml(descricao)+'</td>'
        +'<td>'+escHtml(kmIni)+'</td><td>'+escHtml(kmFim)+'</td>'
        +'<td>'+escHtml(l.it.item)+'</td>'
        +'<td>'+escHtml(l.it.validacao)+'</td><td>'+eapTxt+'</td>'
        +'<td class="l">'+divTxt+'</td><td>'+ccFotosHTML(l.clp.clp,l.it.id)+'</td></tr>';
    }).join('')
    +'</tbody></table></div>';
  h+='</div>';

  alvo.innerHTML=h;
  hydrateLazyPhotos();
}

// ============================================================
// Leitura de planilha com cabeçalho em linha incerta — detecta a linha do
// cabeçalho procurando o texto "hint" em vez de assumir uma posição fixa
// (o painel de pendências já teve um incidente por assumir isso errado).
// Retorna {rows: [{header:valor,...}], headerRowIdx, headerNomes, aoa}.
// ============================================================
function lerPlanilhaComCabecalhoAuto(ws, hintRegex){
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,range:0,defval:null});
  let headerIdx=-1;
  for(let i=0;i<Math.min(15,aoa.length);i++){
    if((aoa[i]||[]).some(c=>typeof c==='string' && hintRegex.test(c))){ headerIdx=i; break; }
  }
  if(headerIdx===-1) throw new Error('Não encontrei a coluna esperada ('+hintRegex+') nas primeiras linhas da planilha.');
  const headerNomes=(aoa[headerIdx]||[]).map(h=>h==null?'':String(h).trim());
  const rows=[];
  for(let r=headerIdx+1;r<aoa.length;r++){
    const linha=aoa[r]; if(!linha)continue;
    const obj={}; let temAlgo=false;
    headerNomes.forEach((nome,ci)=>{ if(!nome)return; const v=linha[ci]; if(v!=null&&v!=='')temAlgo=true; obj[nome]=v==null?null:v; });
    if(temAlgo) rows.push(obj);
  }
  return {rows, headerIdx, headerNomes, aoa};
}

function colIdxToLetter(idx){
  let n=idx+1, s='';
  while(n>0){ const rem=(n-1)%26; s=String.fromCharCode(65+rem)+s; n=Math.floor((n-1)/26); }
  return s;
}

async function carregar(){
  try{
    const r=await fetch(XLSX_URL+'?_='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const wb=XLSX.read(await r.arrayBuffer(),{type:'array'});
    const {rows}=lerPlanilhaComCabecalhoAuto(wb.Sheets['Banco de Dados'], /id_?pend/i);
    ultimasLinhasBanco=rows;
  }catch(e){
    console.warn('Falha ao carregar base EAP para crosscheck:',e);
    ultimasLinhasBanco=null;
  }
  renderCrosscheck();
}
carregar();

// ============================================================
// Upload manual de EAP / CLP — roda tudo no navegador (SheetJS + JSZip),
// sem precisar publicar antes. Fotos de CLP carregadas assim ficam só
// nesta sessão do navegador (memória), não são salvas pra outros usuários.
// ============================================================
async function onEapFileChosen(file){
  if(!file)return;
  const statusEl=document.getElementById('ccUploadStatus');
  statusEl.textContent='Lendo '+file.name+'…';
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const nomeAba=wb.SheetNames.find(n=>/banco de dados/i.test(n))||wb.SheetNames[0];
    const {rows}=lerPlanilhaComCabecalhoAuto(wb.Sheets[nomeAba], /id_?pend/i);
    ultimasLinhasBanco=rows;
    statusEl.textContent='✅ EAP local carregada: '+file.name+' ('+rows.length+' pendências) — usada só nesta sessão do navegador.';
    renderCrosscheck();
  }catch(e){
    console.error(e);
    statusEl.textContent='⚠️ Falha ao ler o EAP: '+e.message;
  }
}

async function findSheetXmlPath(zip, sheetName){
  const wbXmlFile=zip.file('xl/workbook.xml'), relsFile=zip.file('xl/_rels/workbook.xml.rels');
  if(!wbXmlFile||!relsFile)return null;
  const wbXml=await wbXmlFile.async('string'), relsXml=await relsFile.async('string');
  const doc=new DOMParser().parseFromString(wbXml,'application/xml');
  const alvo=[...doc.getElementsByTagName('sheet')].find(s=>s.getAttribute('name')===sheetName);
  if(!alvo)return null;
  const rid=alvo.getAttribute('r:id');
  const relsDoc=new DOMParser().parseFromString(relsXml,'application/xml');
  const rel=[...relsDoc.getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===rid);
  if(!rel)return null;
  let path=rel.getAttribute('Target');
  return path.startsWith('xl/') ? path : 'xl/'+path.replace(/^\.?\/?/,'');
}

// Resolve a cadeia "imagem na célula" do Excel: vm (cabeçalho da celula) ->
// valueMetadata -> futureMetadata (XLRICHVALUE) -> rdrichvalue -> richValueRel
// -> .rels -> arquivo em xl/media. Retorna null se a planilha não usar esse
// recurso (aí o CLP é lido normalmente, só sem fotos).
async function resolveClpImageChain(zip){
  const paths=['xl/metadata.xml','xl/richData/rdrichvalue.xml','xl/richData/richValueRel.xml','xl/richData/_rels/richValueRel.xml.rels'];
  const files=paths.map(p=>zip.file(p));
  if(files.some(f=>!f)) return null;
  const [metaXml,rvXml,relXml,relsXml]=await Promise.all(files.map(f=>f.async('string')));
  const parser=new DOMParser();
  const metaDoc=parser.parseFromString(metaXml,'application/xml');
  const rvDoc=parser.parseFromString(rvXml,'application/xml');
  const relDoc=parser.parseFromString(relXml,'application/xml');
  const relsDoc=parser.parseFromString(relsXml,'application/xml');
  const vIdx=[...metaDoc.getElementsByTagName('rc')].map(n=>parseInt(n.getAttribute('v')));
  const fIdx=[...metaDoc.getElementsByTagName('xlrd:rvb')].map(n=>parseInt(n.getAttribute('i')));
  const rvFirstVal=[...rvDoc.getElementsByTagName('rv')].map(n=>parseInt(n.getElementsByTagName('v')[0].textContent));
  const relRid=[...relDoc.getElementsByTagName('rel')].map(n=>n.getAttribute('r:id'));
  const relsMap={};
  [...relsDoc.getElementsByTagName('Relationship')].forEach(r=>{ relsMap[r.getAttribute('Id')]=r.getAttribute('Target'); });
  return function resolveVm(vm){
    try{
      const target=relsMap[relRid[rvFirstVal[fIdx[vIdx[vm-1]]]]];
      return target ? target.replace('../media/','') : null;
    }catch(e){ return null; }
  };
}

async function onClpFileChosen(file){
  if(!file)return;
  const statusEl=document.getElementById('ccUploadStatus');
  statusEl.textContent='Lendo '+file.name+'…';
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const sheetName=wb.SheetNames.find(n=>/^CLP[-\s]?\d+/i.test(n.trim()));
    if(!sheetName)throw new Error('Não encontrei uma aba "CLP-NNN" nesse arquivo.');
    const {rows,headerIdx,headerNomes}=lerPlanilhaComCabecalhoAuto(wb.Sheets[sheetName], /id_?pend/i);

    const acha=re=>headerNomes.findIndex(h=>re.test(h));
    const idxId=acha(/id_?pend/i), idxItem=acha(/^item$/i), idxKmIni=acha(/km inicial/i), idxKmFim=acha(/km final/i),
      idxTipo=acha(/^tipo$/i), idxResumo=acha(/resumo/i), idxClassif=acha(/classifica.*pend/i),
      idxPrazo=acha(/prazo/i), idxValidacao=acha(/valida.*vale/i), idxObs=acha(/observa/i);
    const idxAntes=acha(/imagens?\s*antes/i);
    const idxDepoisList=headerNomes.map((h,i)=>/imagem\s*depois/i.test(h)?i:-1).filter(i=>i>=0);
    if(idxId<0)throw new Error('Coluna "ID_Pendencia" não encontrada.');

    function fmtKm(v){
      if(v==null||v==='')return null;
      if(typeof v==='string' && v.includes('+'))return v.trim();
      const n=Number(v); if(!Number.isFinite(n))return String(v);
      const km=Math.floor(n/1000), resto=Math.round(n-km*1000);
      return km+'+'+String(resto).padStart(3,'0');
    }
    function fmtPrazo(v){
      if(v==null||v==='')return '';
      if(typeof v==='number'){ const d=new Date(Date.UTC(1899,11,30)+v*86400000); return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear(); }
      return String(v);
    }

    const itens=[], kmMap={}, rowNumById={};
    rows.forEach((row,i)=>{
      const idNum=parseInt(row[headerNomes[idxId]]);
      if(!Number.isFinite(idNum))return;
      itens.push({
        id:idNum,
        item: idxItem>=0?String(row[headerNomes[idxItem]]??''):'',
        tipo: idxTipo>=0?String(row[headerNomes[idxTipo]]??''):'',
        resumo: idxResumo>=0?String(row[headerNomes[idxResumo]]??''):'',
        classif: idxClassif>=0?String(row[headerNomes[idxClassif]]??''):'',
        prazo: idxPrazo>=0?fmtPrazo(row[headerNomes[idxPrazo]]):'',
        validacao: idxValidacao>=0?String(row[headerNomes[idxValidacao]]??''):'',
        obs: idxObs>=0?String(row[headerNomes[idxObs]]??''):''
      });
      rowNumById[idNum]=headerIdx+2+i; // linha física do Excel (1-based)
      const ini=idxKmIni>=0?fmtKm(row[headerNomes[idxKmIni]]):null;
      const fim=idxKmFim>=0?fmtKm(row[headerNomes[idxKmFim]]):null;
      if(ini||fim) kmMap[idNum]=(ini&&fim&&ini!==fim)?('km '+ini+' a '+fim):('km '+(ini||fim));
    });
    Object.assign(CLP_KM, kmMap);

    let evidencias={};
    if(idxAntes>=0 || idxDepoisList.length){
      statusEl.textContent='Lendo fotos de evidência (pode levar um tempinho)…';
      try{
        const zip=await JSZip.loadAsync(buf);
        const sheetXmlPath=await findSheetXmlPath(zip, sheetName);
        const resolveVm=await resolveClpImageChain(zip);
        if(sheetXmlPath && resolveVm){
          const sheetXmlText=await zip.file(sheetXmlPath).async('string');
          const colAntes=idxAntes>=0?colIdxToLetter(idxAntes):null;
          const colsDepois=idxDepoisList.map(colIdxToLetter);
          const rowRegex=/<row r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g;
          const porLinha={};
          let m;
          while((m=rowRegex.exec(sheetXmlText))){ porLinha[m[1]]=m[2]; }
          Object.entries(rowNumById).forEach(([idNum,rowNum])=>{
            const conteudo=porLinha[rowNum]; if(!conteudo)return;
            const entry={};
            if(colAntes){
              const cm=new RegExp('<c r="'+colAntes+rowNum+'"[^>]*vm="(\\d+)"').exec(conteudo);
              if(cm){ const f=resolveVm(parseInt(cm[1])); if(f)entry.antes=f; }
            }
            colsDepois.forEach((col,ci)=>{
              const cm=new RegExp('<c r="'+col+rowNum+'"[^>]*vm="(\\d+)"').exec(conteudo);
              if(cm){ const f=resolveVm(parseInt(cm[1])); if(f)entry['depois'+(ci+1)]=f; }
            });
            if(Object.keys(entry).length) evidencias[idNum]=entry;
          });
        }
        UPLOADED_ZIPS[sheetName.trim()]=zip; // mantém o zip em memória p/ extrair as fotos sob demanda
      }catch(err){
        console.warn('Não consegui extrair as fotos do CLP (dados seguem OK sem foto):', err);
      }
    }

    const clpKey=sheetName.trim();
    const bloco={clp:clpKey, contrato:'(carregado localmente)', ativo:'', atualizado:new Date().toLocaleDateString('pt-BR'), itens};
    const jaExiste=UPLOADED_CLPS.findIndex(c=>c.clp===clpKey);
    if(jaExiste>=0)UPLOADED_CLPS[jaExiste]=bloco; else UPLOADED_CLPS.push(bloco);
    CLP_EVIDENCIAS[clpKey]=evidencias;

    statusEl.textContent='✅ '+clpKey+' carregado: '+itens.length+' itens, '+Object.keys(evidencias).length+' com foto — só nesta sessão do navegador, não fica salvo pra outros usuários.';
    renderCrosscheck();
  }catch(e){
    console.error(e);
    statusEl.textContent='⚠️ Falha ao ler o CLP: '+e.message;
  }
}
